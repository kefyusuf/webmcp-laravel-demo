<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP Laravel Livewire demo video</title>
  <desc id="desc">A clickable poster image for the WebMCP prep list demo video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.52" stop-color="#1f6f78"/>
      <stop offset="1" stop-color="#fca311"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="64" y="64" width="1152" height="592" rx="26" fill="#ffffff" opacity="0.1"/>
  <rect x="96" y="104" width="1088" height="512" rx="18" fill="#0b1220" opacity="0.74" filter="url(#shadow)"/>
  <rect x="130" y="138" width="1020" height="56" rx="10" fill="#f8fafc" opacity="0.12"/>
  <circle cx="164" cy="166" r="8" fill="#ef4444"/>
  <circle cx="190" cy="166" r="8" fill="#f59e0b"/>
  <circle cx="216" cy="166" r="8" fill="#22c55e"/>
  <text x="146" y="272" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">WebMCP Laravel Livewire Demo</text>
  <text x="148" y="326" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27">Browser-discovered tools update the shared prep list</text>
  <g transform="translate(535 366)" filter="url(#shadow)">
    <circle cx="105" cy="105" r="92" fill="#f8fafc" opacity="0.92"/>
    <path d="M86 62 L86 148 L156 105 Z" fill="#14213d"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" fill="#f8fafc">
    <text x="148" y="548">addItem</text>
    <text x="328" y="548">listItems</text>
    <text x="510" y="548">completeItem</text>
  </g>
  <text x="148" y="592" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Click to watch the MP4 demo</text>
</svg>
